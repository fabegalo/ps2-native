name: Core - Build and AOT tests (six native targets)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-2025
            arch: x64
          - name: Windows ARM64
            os: windows-11-arm
            arch: ARM64
          - name: Linux x86-64
            os: ubuntu-24.04
            arch: x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: ARM64
          - name: macOS Intel x86-64
            os: macos-15-intel
            arch: x64
          - name: macOS Apple Silicon ARM64
            os: macos-15
            arch: ARM64
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.2.2 pinned by commit SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configure (Unix / Ninja)
        if: runner.os != 'Windows'
        run: cmake -S . -B out/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2N_REQUIRE_NINJA_PATH_TEST=ON

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B out/build -G "Visual Studio 18 2026" -A "${{ matrix.arch }}" -DPS2N_REQUIRE_NINJA_PATH_TEST=ON

      - name: Build
        run: cmake --build out/build --config Release --parallel 2

      - name: Test long paths and Unicode (260, 500, 1000)
        run: ctest --test-dir out/build -C Release -R "^io-long-paths$" --verbose

      - name: Test AOT end-to-end
        run: ctest --test-dir out/build -C Release -E "^(io-long-paths|aot-long-path-build)$" --output-on-failure

      - name: Test Ninja AOT compilation at long paths (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir out/build -C Release -R "^aot-long-path-build$" --verbose

      - name: Test Ninja AOT compilation at long paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools not found" }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $hostArch = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64" } else { "x64" }
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=${{ matrix.arch }} -host_arch=$hostArch"
          $env:VSLANG = "1033"
          ctest --test-dir out/build -C Release -R "^aot-long-path-build$" --verbose

# Developer-only proof of concept. No publishing or release automation.
