name: Core - PS2Recomp build and content tests (six native targets)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            os: windows-2025
            arch: x64
          - name: Windows ARM64
            os: windows-11-arm
            arch: ARM64
          - name: Linux x86-64
            os: ubuntu-24.04
            arch: x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: ARM64
          - name: macOS Intel x86-64
            os: macos-15-intel
            arch: x64
          - name: macOS Apple Silicon ARM64
            os: macos-15
            arch: ARM64
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.2.2 pinned by commit SHA. PS2Recomp is the
      # external/ps2recomp submodule, pinned in deps.lock.json.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: true

      - name: Apply locked PS2Recomp patches
        shell: pwsh
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} tests/sdk_patch_tests.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/apply-sdk-patches.ps1
          ./scripts/apply-sdk-patches.ps1
          ./scripts/apply-sdk-patches.ps1 -Check

      - name: Fetch locked PCSX2 device sources
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/fetch-pcsx2-components.py

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libasound2-dev pkg-config libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ffmpeg pkgconf

      - name: Configure and build (Unix / Ninja)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B out/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2N_LAUNCHER=OFF -DPS2X_RELEASE_LTCG=OFF
          cmake --build out/build --parallel 2 --target ps2n ps2n-content-tests ps2_runtime kzspu2_test

      # Ninja inside the MSVC developer shell: ps2n builds prepared games with
      # the same toolchain and records its environment at configure time.
      - name: Configure and build (Windows / MSVC + Ninja)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -property installationPath
          if (-not $installation) { throw "Visual Studio C++ tools not found" }
          Import-Module "$installation\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          $hostArch = if ($env:RUNNER_ARCH -eq "ARM64") { "arm64" } else { "x64" }
          $targetArch = "${{ matrix.arch }}".ToLowerInvariant()
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments "-arch=$targetArch -host_arch=$hostArch"
          cmake -S . -B out/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2N_LAUNCHER=OFF -DPS2X_RELEASE_LTCG=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/build --parallel 2 --target ps2n ps2n-content-tests ps2_runtime kzspu2_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test disc access, process supervision and SPU2
        run: ctest --test-dir out/build -R "^(content|spu2)$" --output-on-failure

# Developer-only proof of concept. No publishing or release automation.
